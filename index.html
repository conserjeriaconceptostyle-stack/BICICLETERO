<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Bicicletero</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
<!-- Header con Imagen de Fondo -->
        <div class="relative bg-slate-900 text-white p-6 md:p-8 rounded-2xl shadow-md overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-6 border border-slate-800">
            
            <!-- Imagen de Fondo con Capa Oscura (Overlay) -->
            <img src="https://lh3.googleusercontent.com/d/151HhX6gcxvtE4dzwe85jWwHmwhkQRv3h=s1600" 
                 alt="Edificio Concepto Style Ñuñoa" 
                 class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-900/80 to-slate-950/60"></div>

            <!-- Contenido Frontal -->
            <div class="relative z-10">
                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3 drop-shadow-md">
                    <i class="fa-solid fa-parking text-blue-400"></i> Control de Bicicleteros
                </h1>
                <p class="text-slate-300 text-sm mt-1 drop-shadow-md">Edificio Concepto Style Ñuñoa.</p>
            </div>

            <!-- Contadores sobre el fondo -->
            <div class="relative z-10 flex gap-3 text-sm">
                <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-xl border border-slate-700/70 shadow-md">
                    <span class="text-slate-400 block text-xs">Total Espacios</span>
                    <strong id="totalCount" class="text-lg text-white">0</strong>
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-xl border border-slate-700/70 shadow-md">
                    <span class="text-slate-400 block text-xs">Ocupados</span>
                    <strong id="occupiedCount" class="text-lg text-emerald-400">0</strong>
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-xl border border-slate-700/70 shadow-md">
                    <span class="text-slate-400 block text-xs">Disponibles</span>
                    <strong id="availableCount" class="text-lg text-amber-400">0</strong>
                </div>
            </div>
        </div>

        <!-- Filtros y Buscador -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="search" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Buscar</label>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="search" onkeyup="filterCards()" placeholder="Buscar por N°, Nombre, Dpto, Marca..." 
                           class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
            </div>
            <div>
                <label for="zoneFilter" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Zona / Ubicación</label>
                <select id="zoneFilter" onchange="filterCards()" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                    <option value="">Todas las zonas</option>
                    <option value="ACCESO VEHICULAR">Acceso Vehicular</option>
                    <option value="ACCESO PEATONAL">Acceso Peatonal</option>
                    <option value="PASILLO TORRE A (-1)">Pasillo Torre A (-1)</option>
                    <option value="PASILLO TORRE A (-2)">Pasillo Torre A (-2)</option>
                </select>
            </div>
            <div>
                <label for="statusFilter" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Estado de Ocupación</label>
                <select id="statusFilter" onchange="filterCards()" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                    <option value="">Todos los estados</option>
                    <option value="OCUPADO">Ocupado (TRUE)</option>
                    <option value="DISPONIBLE">Disponible (FALSE)</option>
                </select>
            </div>
        </div>

        <!-- Grid de Tarjetas -->
        <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- Renderizado dinámico -->
        </div>

    </div>

        ];

        function renderCards(data) {
            const container = document.getElementById("cardsGrid");
            container.innerHTML = "";

            let occupied = 0;
            let available = 0;

            data.forEach(item => {
                if (item.estado) occupied++; else available++;

                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col justify-between";

                const isOccupied = item.estado;
                const badgeColor = isOccupied ? "bg-emerald-500 text-white" : "bg-amber-500 text-white";
                const statusText = isOccupied ? "OCUPADO" : "DISPONIBLE";

                // Imagen de tarjeta
                let imageBlock = "";
                if (item.driveUrl) {
                    imageBlock = `
                        <div class="relative h-44 bg-slate-900 group overflow-hidden">
                            <img src="${item.thumbUrl}" alt="Espacio ${item.id}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full bg-slate-800 text-slate-400 text-xs p-4 text-center\\'>Ver imagen en Google Drive</div>'">
                            <a href="${item.driveUrl}" target="_blank" class="absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm text-slate-800 hover:bg-white text-xs px-3 py-1.5 rounded-lg shadow font-medium flex items-center gap-1.5">
                                <i class="fa-solid fa-arrow-up-right-from-square text-blue-600"></i> Abrir Foto
                            </a>
                        </div>
                    `;
                } else if (item.imagen) {
                    imageBlock = `
                        <div class="h-24 bg-slate-50 border-b border-slate-100 flex items-center justify-center p-3 text-slate-400 text-xs">
                            <i class="fa-regular fa-image text-lg mr-2"></i> Imagen asignada: <strong class="ml-1 text-slate-600">${item.imagen}</strong>
                        </div>
                    `;
                } else {
                    imageBlock = `
                        <div class="h-16 bg-slate-50/50 border-b border-slate-100 flex items-center justify-center text-slate-300 text-xs">
                            <i class="fa-solid fa-camera text-slate-300 mr-2"></i> Sin imagen adjunta
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <!-- Header de Tarjeta -->
                        <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wide">Espacio</span>
                                <h3 class="text-xl font-bold text-slate-800">N° ${item.id}</h3>
                            </div>
                            <span class="px-2.5 py-1 text-xs font-extrabold rounded-full ${badgeColor}">
                                ${statusText}
                            </span>
                        </div>

                        <!-- Imagen -->
                        ${imageBlock}

                        <!-- Info Body -->
                        <div class="p-4 space-y-3 text-sm">
                            <div class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md inline-block">
                                <i class="fa-solid fa-location-dot mr-1"></i> ${item.zona}
                            </div>

                            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
                                <div>
                                    <span class="text-xs text-slate-400 block">Departamento:</span>
                                    <span class="${item.dpto ? 'font-bold text-slate-800' : 'text-slate-300 font-light'}">${item.dpto || 'Sin asignar'}</span>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 block">Residente:</span>
                                    <span class="${item.nombre ? 'font-medium text-slate-700' : 'text-slate-300 font-light'}">${item.nombre || 'Vacío'}</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 text-xs">
                                <div>
                                    <span class="text-slate-400 block">Marca / Modelo:</span>
                                    <span class="${item.marca ? 'text-slate-700 font-medium' : 'text-slate-300'}">${item.marca || '-'}</span>
                                </div>
                                <div>
                                    <span class="text-slate-400 block">Color:</span>
                                    <span class="${item.color ? 'text-slate-700 font-medium' : 'text-slate-300'}">${item.color || '-'}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Botón de Enlace Directo (si aplica) -->
                    ${item.driveUrl ? `
                        <div class="p-3 bg-slate-50 border-t border-slate-100 text-center">
                            <a href="${item.driveUrl}" target="_blank" class="text-xs text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center gap-1">
                                <i class="fa-brands fa-google-drive"></i> Ver archivo en Google Drive
                            </a>
                        </div>
                    ` : ''}
                `;

                container.appendChild(card);
            });

            document.getElementById("totalCount").innerText = data.length;
            document.getElementById("occupiedCount").innerText = occupied;
            document.getElementById("availableCount").innerText = available;
        }

        function filterCards() {
            const searchValue = document.getElementById("search").value.toLowerCase();
            const zoneValue = document.getElementById("zoneFilter").value;
            const statusValue = document.getElementById("statusFilter").value;

            const filtered = rawData.filter(item => {
                const matchesSearch = 
                    item.id.toLowerCase().includes(searchValue) ||
                    item.dpto.toLowerCase().includes(searchValue) ||
                    item.nombre.toLowerCase().includes(searchValue) ||
                    item.marca.toLowerCase().includes(searchValue) ||
                    item.color.toLowerCase().includes(searchValue);

                const matchesZone = zoneValue === "" || item.zona === zoneValue;
                const statusText = item.estado ? "OCUPADO" : "DISPONIBLE";
                const matchesStatus = statusValue === "" || statusText === statusValue;

                return matchesSearch && matchesZone && matchesStatus;
            });

            renderCards(filtered);
        }

        // Carga inicial
        renderCards(rawData);
    </script>
